<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2A63"/>
      <stop offset="50%" stop-color="#071E4A"/>
      <stop offset="100%" stop-color="#04122E"/>
    </linearGradient>

    <!-- Cap Shading Gradients -->
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="capUnderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Clip Path for App Icon Rounded Squircle -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main Background Container with App Icon Rounded Corners -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Icon Elements Clipped to Squircle -->
  <g clip-path="url(#squircleClip)">
    
    <!-- ========================================== -->
    <!-- 1. GRADUATION MORTARBOARD CAP (TOP)        -->
    <!-- ========================================== -->
    <g filter="url(#softShadow)">
      <!-- Cap Base / Skullcap -->
      <path d="M 180 120 L 180 155 Q 256 190 332 155 L 332 120 Z" fill="url(#capUnderGrad)"/>
      <path d="M 190 125 L 190 152 Q 256 182 322 152 L 322 125 Z" fill="#FFFFFF"/>

      <!-- Mortarboard Diamond Top Surface -->
      <polygon points="256,48 382,105 256,152 130,105" fill="url(#capTopGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Button on Top Center -->
      <ellipse cx="256" cy="100" rx="6" ry="3.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Tassel Ribbon & Brush -->
      <!-- Tassel string draping over the right edge -->
      <path d="M 256 100 C 290 102 360 110 366 145" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="366" cy="148" rx="4" ry="4" fill="#FFFFFF"/>
      <!-- Tassel Brush -->
      <polygon points="363,150 369,150 373,178 359,178" fill="#FFFFFF"/>
      <line x1="363" y1="178" x2="363" y2="182" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="366" y1="178" x2="366" y2="183" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="369" y1="178" x2="369" y2="182" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- ========================================== -->
    <!-- 2. OPEN BOOK WITH SA FLAG WINGS (CENTER)   -->
    <!-- ========================================== -->
    <g filter="url(#softShadow)">
      <!-- White Base Pages Underlying Book -->
      <path d="M 256 220 C 215 220 150 210 102 185 L 102 245 C 150 270 215 280 256 280 Z" fill="#F8FAFC"/>
      <path d="M 256 220 C 297 220 362 210 410 185 L 410 245 C 362 270 297 280 256 280 Z" fill="#F8FAFC"/>

      <!-- Left Page Wing (South African Flag Motifs) -->
      <!-- Green Upper Field -->
      <path d="M 256 215 C 215 215 152 205 106 180 L 106 208 C 152 233 215 243 256 243 Z" fill="#007749"/>
      <!-- Black Triangle / Chevron with Yellow/Gold Border -->
      <path d="M 106 208 C 145 224 195 235 228 238 L 106 250 Z" fill="#FFB81C"/>
      <path d="M 106 212 C 140 226 185 235 218 238 L 106 247 Z" fill="#000000"/>
      <!-- Yellow / Gold Lower Accent Stripe -->
      <path d="M 106 250 C 152 268 215 272 256 272 L 256 262 C 215 262 152 255 106 240 Z" fill="#FFB81C"/>

      <!-- Right Page Wing (South African Flag Motifs) -->
      <!-- Green Upper Field -->
      <path d="M 256 215 C 297 215 360 205 406 180 L 406 208 C 360 233 297 243 256 243 Z" fill="#007749"/>
      <!-- Red Top Stripe with White Border -->
      <path d="M 256 228 C 297 228 360 220 406 200 L 406 230 C 360 248 297 254 256 254 Z" fill="#FFFFFF"/>
      <path d="M 264 230 C 300 230 360 222 404 204 L 404 226 C 360 244 300 250 264 250 Z" fill="#E03C31"/>
      <!-- Blue Bottom Stripe -->
      <path d="M 256 254 C 297 254 360 248 406 230 L 406 255 C 360 272 297 274 256 274 Z" fill="#002395"/>

      <!-- Central Spine Divider -->
      <path d="M 254 212 L 258 212 L 258 282 L 254 282 Z" fill="#FFFFFF"/>
    </g>

    <!-- ========================================== -->
    <!-- 3. TYPOGRAPHY: Distinction ZA + TAGLINE    -->
    <!-- ========================================== -->
    <g filter="url(#textGlow)">
      <!-- "Distinction ZA" -->
      <text x="256" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
        <tspan fill="#FFFFFF" font-weight="900" font-size="54" letter-spacing="-1">Distinction</tspan>
        <tspan fill="#FFC72C" font-weight="900" font-size="56" letter-spacing="1"> ZA</tspan>
      </text>

      <!-- Tagline -->
      <text x="256" y="378" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16.5" letter-spacing="0.2" opacity="0.95">
        Learn Today. Improve Tomorrow.
      </text>
      <text x="256" y="405" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16.5" letter-spacing="0.2" opacity="0.95">
        Achieve Your Distinction.
      </text>
    </g>

    <!-- ========================================== -->
    <!-- 4. BOTTOM DYNAMIC SA FLAG SWOOSH RIBBON    -->
    <!-- ========================================== -->
    <!-- Bottom Left into Bottom Right Sweeping Bands -->
    <!-- Green Swathe -->
    <path d="M -10 405 C 120 460 280 500 525 435 L 530 525 L -20 530 Z" fill="#007749"/>
    <!-- Yellow / Gold Stripe -->
    <path d="M -10 425 C 130 480 300 515 525 460 L 530 525 L -20 530 Z" fill="#FFB81C"/>
    <!-- Black Chevron Band -->
    <path d="M -10 445 C 140 498 320 525 525 480 L 530 525 L -20 530 Z" fill="#000000"/>
    <!-- Red Stripe -->
    <path d="M 280 515 C 370 510 460 485 530 435 L 530 470 C 460 510 380 525 290 528 Z" fill="#E03C31"/>
    <!-- White Divider Line -->
    <path d="M 290 524 C 380 520 465 500 530 468 L 530 475 C 465 506 385 524 295 528 Z" fill="#FFFFFF"/>
    <!-- Blue Lower Stripe -->
    <path d="M 320 528 C 400 522 475 505 530 475 L 530 530 L 320 530 Z" fill="#002395"/>

  </g>
</svg>
